# One run of the Day 4 MQAR reproduction: gdn at d_model = 128.
# torchtitan form: the flags of a run are this file. The learning rate here is
# the base value; sweep.py writes one copy per learning rate into generated/.

[run]
mixer = "gdn"           # attn | linattn | deltanet | gdn

[model]
d_model = 128
n_layers = 2
num_heads = 2
embed_dropout = 0.1       # Zoology: dropout on the embeddings
attn_dropout = 0.1        # Zoology: dropout on the attention weights (attention only)

[data]
vocab_size = 8192
input_seq_len = 512
num_kv_pairs = 64
num_train = 100000         # 20k let every mixer memorize the train set instead of learning recall
num_test = 3000
power_a = 0.01
random_non_queries = false
data_seed = 123           # the same examples for every run of the day

[training]
max_epochs = 64
batch_size = 512
test_batch_size = 256
lr = 1e-3
weight_decay = 0.1
early_stop_acc = 0.99     # stop after the first epoch whose test accuracy exceeds this
precision = "bf16"
