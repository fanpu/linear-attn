# One locked environment for the whole training-dynamics course.
# CPU-only: torch comes from the PyTorch CPU index on Linux (so the lock never
# pulls CUDA wheels) and from PyPI elsewhere (macOS wheels are CPU/MPS already).
[project]
name = "tdyn"
version = "0.1.0"
description = "Shared code for the training-dynamics self-study course (integrators, GD loops, Hessian tools, anchor model, plotting)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "torch>=2.4",
    "pytest>=8.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tdyn*"]

[tool.pytest.ini_options]
# Run from the course root: `uv run pytest a0-prereqs` (add --solutions for the references).
addopts = "-q --import-mode=importlib"
